<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Eng900 – Luyện TOEIC 900 & Giao tiếp</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #F2F5FA;
      --card: #fff;
      --ink: #14213D;
      --mut: #5B6785;
      --line: #D9E0EE;
      --acc: #2B4EFF;
      --accT: #fff;
      --hl: #FFD23F;
      --ok: #0E8F4A;
      --bad: #D6336C;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #0E1424;
        --card: #171F36;
        --ink: #EAF0FF;
        --mut: #9AA6C6;
        --line: #2A3556;
        --acc: #7C95FF;
        --accT: #0E1424;
        --ok: #3DD68C;
        --bad: #FF7AA8
      }
    }

    :root[data-theme="dark"] {
      --bg: #0E1424;
      --card: #171F36;
      --ink: #EAF0FF;
      --mut: #9AA6C6;
      --line: #2A3556;
      --acc: #7C95FF;
      --accT: #0E1424;
      --ok: #3DD68C;
      --bad: #FF7AA8
    }

    * {
      box-sizing: border-box
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 400 16px/1.6 "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif
    }

    header {
      max-width: 860px;
      margin: 0 auto;
      padding: 28px 18px 8px
    }

    h1 {
      font-size: clamp(28px, 6vw, 44px);
      line-height: 1.1;
      margin: 0 0 6px;
      font-weight: 800;
      letter-spacing: -.02em
    }

    h1 mark {
      background: var(--hl);
      color: #14213D;
      padding: 0 8px;
      border-radius: 6px
    }

    .sub {
      color: var(--mut);
      margin: 0;
      max-width: 60ch
    }

    .modes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 18px
    }

    .modes button {
      text-align: left;
      border: 2px solid var(--line);
      background: var(--card);
      color: var(--ink);
      border-radius: 14px;
      padding: 12px 14px;
      font: 700 16px "Be Vietnam Pro", sans-serif;
      cursor: pointer
    }

    .modes button small {
      display: block;
      font: 400 13px "Be Vietnam Pro", sans-serif;
      color: var(--mut)
    }

    .modes button[aria-pressed=true] {
      border-color: var(--acc);
      background: color-mix(in srgb, var(--acc) 12%, var(--card))
    }

    :root[data-mode="chat"] {
      --acc: #0A8F7A
    }

    @media (prefers-color-scheme:dark) {
      :root[data-mode="chat"]:not([data-theme="light"]) {
        --acc: #4FD6BE
      }
    }

    :root[data-mode="chat"][data-theme="dark"] {
      --acc: #4FD6BE
    }

    @media (max-width:480px) {
      .modes {
        grid-template-columns: 1fr
      }
    }

    nav {
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 5;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
      margin-top: 14px
    }

    nav div {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      gap: 4px;
      overflow-x: auto;
      padding: 8px 14px
    }

    nav button {
      flex: none;
      border: 0;
      background: none;
      color: var(--mut);
      font: 500 15px "Be Vietnam Pro", sans-serif;
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer
    }

    nav button[aria-selected=true] {
      background: var(--ink);
      color: var(--bg);
      font-weight: 700
    }

    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 20px 18px 60px
    }

    h2 {
      font-size: 24px;
      margin: 0 0 4px
    }

    h3 {
      font-size: 18px;
      margin: 0 0 6px
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      margin: 14px 0
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center
    }

    .btn {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      font: 500 14px "Be Vietnam Pro", sans-serif;
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer
    }

    .btn.p {
      background: var(--acc);
      color: var(--accT);
      border-color: var(--acc);
      font-weight: 700
    }

    button:focus-visible,
    textarea:focus-visible,
    input:focus-visible {
      outline: 3px solid var(--acc);
      outline-offset: 2px
    }

    .mut {
      color: var(--mut);
      font-size: 14px
    }

    .score {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
      margin: 14px 0
    }

    .score div {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px
    }

    .score b {
      display: block;
      font-size: 26px;
      line-height: 1.1
    }

    .bar {
      height: 10px;
      background: var(--line);
      border-radius: 9px;
      overflow: hidden;
      margin: 8px 0
    }

    .bar i {
      display: block;
      height: 100%;
      background: var(--acc);
      transition: width .3s
    }

    label.chk {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 6px 0;
      cursor: pointer
    }

    label.chk input {
      margin-top: 6px;
      width: 18px;
      height: 18px;
      accent-color: var(--acc)
    }

    label.chk input:checked+span {
      text-decoration: line-through;
      color: var(--mut)
    }

    .opt {
      display: block;
      width: 100%;
      text-align: left;
      margin: 6px 0
    }

    .opt.ok {
      border-color: var(--ok);
      background: color-mix(in srgb, var(--ok) 15%, transparent)
    }

    .opt.no {
      border-color: var(--bad);
      background: color-mix(in srgb, var(--bad) 15%, transparent)
    }

    .ipa {
      color: var(--acc);
      font-family: "Noto Sans", "Segoe UI", "DejaVu Sans", "Charis SIL", system-ui, sans-serif
    }

    .flash small.ipa {
      font-size: 20px;
      font-weight: 500;
      color: var(--acc);
      margin-top: 2px
    }

    .btn:disabled {
      opacity: .45;
      cursor: not-allowed
    }

    .sp {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      padding: 0 6px;
      margin: 0 4px
    }

    .opt:disabled {
      color: var(--ink);
      opacity: 1;
      cursor: default
    }

    .exp {
      margin-top: 8px;
      font-size: 14px;
      color: var(--mut);
      border-left: 3px solid var(--hl);
      padding-left: 10px
    }

    .line {
      display: flex;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 10px;
      cursor: pointer;
      margin: 4px 0
    }

    .line:hover {
      background: var(--bg)
    }

    .line.me {
      background: color-mix(in srgb, var(--acc) 10%, transparent)
    }

    .line b {
      flex: none;
      width: 24px;
      color: var(--acc)
    }

    .vi {
      color: var(--mut);
      font-size: 14px;
      display: block
    }

    .hide .vi {
      display: none
    }

    .blur .me .en {
      filter: blur(6px)
    }

    .blur .me .en:hover {
      filter: none
    }

    .flash {
      min-height: 190px;
      display: grid;
      place-items: center;
      text-align: center;
      cursor: pointer;
      font-size: 30px;
      font-weight: 800
    }

    .flash small {
      display: block;
      font-size: 15px;
      font-weight: 400;
      color: var(--mut);
      margin-top: 8px
    }

    textarea {
      width: 100%;
      min-height: 170px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--bg);
      color: var(--ink);
      font: 400 16px/1.6 "Be Vietnam Pro", sans-serif;
      padding: 12px;
      resize: vertical
    }

    .tag {
      display: inline-block;
      background: var(--hl);
      color: #14213D;
      font-size: 13px;
      font-weight: 700;
      border-radius: 6px;
      padding: 0 8px
    }

    .res {
      font-weight: 700;
      margin-top: 8px
    }
  </style>
</head>

<body>
  <header>
    <h1>Eng<mark>900</mark></h1>
    <p class="sub">Hai chương trình riêng biệt: luyện thi TOEIC 900+ đủ 4 kỹ năng, và tiếng Anh giao tiếp hằng ngày.</p>
    <div class="modes" id="modes"></div>
  </header>
  <nav>
    <div role="tablist" id="tabs"></div>
  </nav>
  <main id="view"></main>

  <script>
    const $ = s => document.querySelector(s);
    let S = {}; try { S = JSON.parse(localStorage.getItem('eng900') || '{}') } catch (e) { }
    const save = () => { try { localStorage.setItem('eng900', JSON.stringify(S)) } catch (e) { } };
    const hasTTS = 'speechSynthesis' in window;
    function say(t, r) { if (!hasTTS) { alert('Trình duyệt chưa hỗ trợ đọc giọng nói.'); return } speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; u.rate = r || (S.rate || 0.95); speechSynthesis.speak(u) }
    function sayList(a) { if (!hasTTS) return; speechSynthesis.cancel(); a.forEach(t => { const u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; u.rate = S.rate || 0.95; speechSynthesis.speak(u) }) }
    const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');

    /* ---------- DATA ---------- */
    const PLAN = [
      ["Tuần 1–3 · Nền tảng", ["Ôn 12 thì + câu điều kiện + mệnh đề quan hệ", "Học 300 từ TOEIC đầu (sheet Từ vựng, 15 từ/ngày)", "Nghe Part 1–2 mỗi ngày 20 phút, chép chính tả"]],
      ["Tuần 4–6 · Tăng tốc", ["Làm Part 5–6: 30 câu/ngày, ghi sổ lỗi sai", "Nghe Part 3–4: đọc câu hỏi trước, gạch từ khóa", "Viết 1 email công việc (80–100 từ) mỗi 2 ngày"]],
      ["Tuần 7–9 · Bứt phá", ["Đọc Part 7 có bấm giờ: 1 đoạn đơn ≤ 2 phút", "Shadowing 15 phút/ngày với audio Part 3–4", "Nói to 10 câu mẫu mỗi ngày, ghi âm và so lại"]],
      ["Tuần 10–12 · Thi thử", ["Thi thử đủ 200 câu 2 lần/tuần, bấm giờ 120 phút", "Phân tích lỗi sai theo dạng (từ loại, giới từ, suy luận)", "Viết 1 bài luận 150–300 từ + sửa theo checklist"]]];
    const PART5 = [
      ["The manager asked all employees to submit their reports ____ Friday.", ["by", "at", "during", "since"], 0, "“by + mốc thời gian” = trước hạn chót."],
      ["Ms. Lee is responsible ____ training new staff.", ["of", "for", "with", "to"], 1, "be responsible for + V-ing."],
      ["____ the heavy rain, the outdoor event went ahead as planned.", ["Although", "Despite", "Because", "However"], 1, "Despite + cụm danh từ (the heavy rain). Although cần một mệnh đề."],
      ["The new software is ____ easier to use than the old one.", ["much", "very", "so", "too"], 0, "much + so sánh hơn. very không đi với so sánh hơn."],
      ["Please ____ the attached invoice before the end of the month.", ["review", "reviewing", "reviewed", "reviews"], 0, "Câu mệnh lệnh dùng động từ nguyên mẫu."],
      ["Sales have increased ____ since the campaign launched.", ["significant", "significance", "significantly", "signify"], 2, "Cần trạng từ bổ nghĩa cho động từ increase."],
      ["If the shipment ____ on time, we will start production.", ["arrive", "arrives", "will arrive", "arrived"], 1, "Câu điều kiện loại 1: if + hiện tại đơn."],
      ["Mr. Tan, ____ has worked here for ten years, will retire next month.", ["who", "whom", "which", "whose"], 0, "Chỉ người, làm chủ ngữ của has worked → who."]];
    const PART2 = [
      ["When is the budget meeting?", ["In the conference room.", "At three o'clock tomorrow.", "Yes, I did."], 1, "Câu hỏi When → trả lời bằng thời gian."],
      ["Would you like me to book a taxi for you?", ["No, I'll take the subway.", "It was a nice trip.", "Two tickets, please."], 0, "Lời đề nghị → từ chối và nêu phương án khác."],
      ["Who's in charge of the new marketing campaign?", ["Next quarter.", "It's very effective.", "Ms. Park is, I believe."], 2, "Who → trả lời bằng tên người."],
      ["Why was the flight delayed?", ["Because of bad weather.", "About two hours.", "At gate twelve."], 0, "Why → lý do, thường bắt đầu bằng Because."],
      ["Haven't you finished the sales report yet?", ["Yes, it's on your desk.", "Last Monday.", "A new printer."], 0, "Câu hỏi phủ định vẫn trả lời Yes nếu đã xong."]];
    const SPEAK = ["Thank you for calling. How may I direct your call?", "The conference has been rescheduled to next Thursday afternoon.", "Could you send me the updated schedule by the end of the day?", "We are pleased to announce that our quarterly revenue has increased.", "I'd like to book a table for four people at seven o'clock.", "Unfortunately, the item you ordered is currently out of stock."];
    const WRITE = [
      { t: "Email phản hồi khách hàng (≥ 80 từ)", p: "A customer wrote that the product she received was damaged. Reply: apologize, explain what you will do, and tell her what she needs to send you.", m: "Dear Ms. Nguyen,\n\nThank you for contacting us, and I sincerely apologize that your order arrived damaged. We will send you a replacement free of charge within three business days.\n\nTo speed things up, please reply with a photo of the damaged item and your order number. You do not need to return the damaged product.\n\nIf you have any further questions, please do not hesitate to contact me directly.\n\nBest regards,\nDavid Tran\nCustomer Service" },
      { t: "Bài luận quan điểm (≥ 150 từ để luyện)", p: "Some people prefer working from home, while others prefer working in an office. Which do you prefer? Give reasons and examples.", m: "I prefer working from home for two main reasons. First, it saves time and money. I no longer spend two hours commuting, so I can use that time to finish important tasks or exercise. Second, I concentrate better at home. In an open office, noise and constant interruptions make it hard to focus.\n\nHowever, I admit that the office has benefits, such as easier teamwork. For this reason, the ideal solution is a hybrid schedule. In conclusion, working from home is more productive for me, as long as I meet my team regularly." }];
    const CHK = ["Mở bài nêu rõ ý chính / mục đích", "Có ít nhất 2 lý do, mỗi lý do kèm ví dụ", "Dùng từ nối: First, However, As a result, In conclusion", "Soát chủ–vị, thì động từ, mạo từ a/an/the", "Giọng văn phù hợp (email: lịch sự, trang trọng)"];
    const CONV = [
      ["Gọi đồ ở quán cà phê", [["A", "Hi, what can I get for you today?", "Chào bạn, bạn muốn dùng gì?"], ["B", "Can I have a medium iced latte, please?", "Cho mình một ly latte đá cỡ vừa."], ["A", "Sure. Would you like any milk alternatives?", "Vâng. Bạn có muốn đổi sang sữa thực vật không?"], ["B", "Oat milk, please. And is the banana bread fresh?", "Sữa yến mạch nhé. Bánh chuối có mới không?"], ["A", "Baked this morning. Anything else?", "Mới nướng sáng nay. Còn gì nữa không?"], ["B", "That's all, thanks. Can I pay by card?", "Vậy thôi, cảm ơn. Mình trả bằng thẻ được không?"]]],
      ["Nhận phòng khách sạn", [["A", "Good evening. Do you have a reservation?", "Chào buổi tối. Anh/chị có đặt phòng chưa?"], ["B", "Yes, under the name Minh Tran for two nights.", "Có, tên Minh Tran, hai đêm."], ["A", "Let me check. Could I see your passport, please?", "Để tôi kiểm tra. Cho tôi xem hộ chiếu."], ["B", "Here you go. Is breakfast included?", "Đây ạ. Có gồm bữa sáng không?"], ["A", "Yes, from 6:30 to 10 on the second floor.", "Có, từ 6:30 đến 10 giờ ở tầng hai."], ["B", "Great. Could I get a late check-out tomorrow?", "Tuyệt. Mai mình trả phòng muộn được không?"]]],
      ["Họp & phỏng vấn công việc", [["A", "Thanks for coming in. Could you tell me about yourself?", "Cảm ơn bạn đã đến. Bạn giới thiệu về mình nhé?"], ["B", "Certainly. I have five years of experience in digital marketing.", "Vâng. Tôi có năm năm kinh nghiệm marketing số."], ["A", "What was your biggest achievement in your last role?", "Thành tích lớn nhất ở vị trí trước là gì?"], ["B", "I led a campaign that increased online sales by 40 percent.", "Tôi dẫn dắt chiến dịch tăng doanh số online 40%."], ["A", "Impressive. Why do you want to join our company?", "Ấn tượng đấy. Vì sao bạn muốn vào công ty?"], ["B", "I admire your growth and I'd like to contribute to it.", "Tôi ngưỡng mộ sự phát triển của công ty và muốn góp sức."]]],
      ["Hỏi đường & làm quen", [["A", "Excuse me, could you tell me how to get to the station?", "Xin lỗi, bạn chỉ giúp đường đến nhà ga?"], ["B", "Sure. Go straight, then turn left at the traffic light.", "Được. Đi thẳng rồi rẽ trái ở đèn giao thông."], ["A", "Is it far from here?", "Từ đây có xa không?"], ["B", "Not really, about a ten-minute walk.", "Không xa, đi bộ khoảng 10 phút."], ["A", "Thank you so much. By the way, I'm Lan. Nice to meet you.", "Cảm ơn nhiều. À mình là Lan, rất vui được gặp."], ["B", "I'm Tom. Enjoy your trip!", "Mình là Tom. Chúc chuyến đi vui vẻ!"]]]];
    const VOC = [["negotiate", "đàm phán", "We negotiated a better price."], ["deadline", "hạn chót", "The deadline is next Friday."], ["refund", "hoàn tiền", "You can request a full refund."], ["reimburse", "hoàn trả chi phí", "The company will reimburse your travel costs."], ["allocate", "phân bổ", "We allocated more budget to marketing."], ["implement", "triển khai", "They will implement the new policy in May."], ["revenue", "doanh thu", "Annual revenue rose by 12 percent."], ["candidate", "ứng viên", "Each candidate has an interview today."], ["invoice", "hóa đơn", "Please pay the invoice within 30 days."], ["postpone", "hoãn lại", "The meeting was postponed until Monday."], ["mandatory", "bắt buộc", "Attendance at the training is mandatory."], ["renew", "gia hạn", "I need to renew my contract."], ["inventory", "hàng tồn kho", "We check inventory every week."], ["comply with", "tuân thủ", "All staff must comply with safety rules."], ["shortage", "sự thiếu hụt", "There is a shortage of skilled workers."], ["subsidiary", "công ty con", "The subsidiary opened a new office."], ["estimate", "ước tính", "Can you estimate the total cost?"], ["reliable", "đáng tin cậy", "She is a reliable team member."], ["competitive", "có tính cạnh tranh", "We offer competitive salaries."], ["warranty", "bảo hành", "The laptop has a two-year warranty."]];

    /* ---------- TABS ---------- */
    const MODES = {
      toeic: { n: "Luyện thi TOEIC", d: "Mục tiêu 900+ · Nghe, Nói, Đọc, Viết", tabs: [["plan", "Lộ trình"], ["listen", "Nghe"], ["read", "Đọc"], ["speak", "Nói"], ["write", "Viết"], ["vocab", "Từ vựng"]] },
      chat: { n: "Tiếng Anh giao tiếp", d: "Hội thoại, mẫu câu, phản xạ nói", tabs: [["chat", "Hội thoại"], ["speak", "Luyện nói"], ["vocab", "Cụm từ"]] }
    };
    let mode = MODES[S.mode] ? S.mode : 'toeic';
    function drawModes() {
      document.documentElement.dataset.mode = mode;
      $('#modes').innerHTML = Object.entries(MODES).map(([k, m]) => `<button data-m="${k}" aria-pressed="${k === mode}">${m.n}<small>${m.d}</small></button>`).join('');
      $('#tabs').innerHTML = MODES[mode].tabs.map(([k, n]) => `<button role="tab" data-k="${k}">${n}</button>`).join('')
    }
    $('#modes').onclick = e => { const b = e.target.closest('button'); if (b && b.dataset.m !== mode) { mode = b.dataset.m; S.mode = mode; save(); vi = 0; flip = false; vcat = 'all'; Q = null; drawModes(); go(MODES[mode].tabs[0][0]) } };
    $('#tabs').onclick = e => { const b = e.target.closest('button'); if (b) go(b.dataset.k) };
    function go(k) { const prev = curTab; curTab = k; if (hasTTS) speechSynthesis.cancel(); const v = $('#view'); v.onclick = v.onchange = v.oninput = null; document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.k === k)); v.innerHTML = V[k](); if (prev !== k) window.scrollTo(0, 0); if (I[k]) I[k]() }
    const V = {}, I = {};

    /* ---------- PLAN ---------- */
    V.plan = () => {

    async function callGemini(promptText) {
      const apiKey = getApiKey();
      if (!apiKey) throw new Error("Chưa nhập API Key");

      const model = "gemini-3.8-flash";
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`;

      for (let attempt = 1; attempt <= 3; attempt++) {
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: promptText }] }],
            generationConfig: {
              responseMimeType: "application/json"
            }
          })
        });

        const data = await res.json().catch(() => ({}));

        if (res.ok) {
          let rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || "[]";
          rawText = rawText.replace(/^```json\s*/i, "").replace(/```\s*$/i, "").trim();
          return JSON.parse(rawText);
        }

        if (res.status === 429 || res.status === 503) {
          if (attempt < 3) {
            const waitSec = attempt * 6;
            vErr = `Server đang bận hoặc chạm giới hạn (${res.status}), tự thử lại sau ${waitSec}s…`;
            setMsg(vstat());
            await sleep(waitSec * 1000);
            continue;
          } else {
            throw new Error(`Chạm giới hạn tốc độ miễn phí (${res.status}). Hãy đợi khoảng 30 giây rồi bấm lại nhé!`);
          }
        }

        throw new Error(data?.error?.message || `HTTP ${res.status}`);
      }
    }

    async function enrich(ids) {
      if (!getApiKey()) {
        vErr = 'chưa nhập Gemini API Key (bấm "🔑 Nhập API Key" để cài đặt)';
        setMsg(vstat());
        return false;
      }
      if (isCallingApi) return false;

      const L = VL(), m = mode;
      const need = ids.filter(i => !E[ek(i)] && !busy.has(ek(i))).slice(0, 15);
      if (!need.length) return true;

      isCallingApi = true;
      const keys = {};
      need.forEach(i => {
        keys[L[i][0]] = m + '|' + L[i][0];
        busy.add(m + '|' + L[i][0]);
      });
      setMsg(vstat());

      const items = JSON.stringify(need.map(i => ({ w: L[i][0], vi: L[i][1] })));
      const kind = m === 'chat'
        ? 'a short, natural everyday spoken line that uses the phrase'
        : 'one natural business-English sentence in TOEIC style (8-15 words) that uses the word';

      const prompt = `For each item return a JSON array of objects {"w": the item text exactly as given, "pos": its part of speech in the example using only n, v, adj, adv, prep, conj, phr. v, phr. or n/v, "ex": ${kind}, "vi": the Vietnamese translation of the sentence}. Return only the JSON array. Items: ${items}`;

      try {
        const r = await callGemini(prompt);
        (Array.isArray(r) ? r : (r && r.items) || []).forEach(o => {
          if (o && keys[o.w] && o.ex) {
            E[keys[o.w]] = { pos: o.pos || '', ex: o.ex, vi: o.vi || '' };
          }
        });
        saveE();
        dbSave(Object.values(keys));
        vErr = '';
        return true;
      } catch (e) {
        console.error("Gemini Error:", e);
        vErr = e.message || 'Lỗi gọi Gemini API';
        return false;
      } finally {
        isCallingApi = false;
        Object.values(keys).forEach(k => busy.delete(k));
        if (curTab === 'vocab' && vview !== 'quiz' && !(document.activeElement && document.activeElement.id === 'qi')) {
          go('vocab');
        } else {
          setMsg(vstat());
        }
      }
    }

    const nz = t => String(t).toLowerCase().replace(/'/g, '').replace(/[^a-z ]/g, ' ').split(/\s+/).filter(Boolean);
    function recCheck(target, show) {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { show('<span class="mut">Trình duyệt chưa hỗ trợ nhận dạng giọng nói. Hãy dùng Chrome hoặc Edge (địa chỉ https).</span>'); return }
      if (hasTTS) speechSynthesis.cancel(); const rc = new SR(); rc.lang = 'en-US'; rc.maxAlternatives = 5; show('🎙 Đang nghe… hãy đọc to và rõ.');
      const tw = nz(target), tj = tw.join(''); let done = false;
      rc.onresult = ev => {
        done = true; const alts = [...ev.results[0]]; let best = null;
        alts.forEach(a => { const hw = nz(a.transcript), sc = hw.join('') === tj ? tw.length + 1 : tw.filter(w => hw.includes(w)).length; if (!best || sc > best.sc) best = { sc, a, hw } });
        const hit = Math.min(best.sc, tw.length), pc = Math.round(hit / tw.length * 100), conf = Math.round((best.a.confidence || 0) * 100), miss = tw.filter(w => !best.hw.includes(w)); let v;
        if (pc === 100) v = conf && conf < 50 ? '<b>◐ Đúng từ nhưng giọng chưa rõ.</b> Hãy đọc rõ hơn.' : '<b style="color:var(--ok)">✓ Phát âm đúng!</b>';
        else if (pc >= 50) v = `<b>◐ Gần đúng (${pc}%).</b> Cần đọc rõ: ${esc(miss.join(', '))}`;
        else v = `<b style="color:var(--bad)">✗ Chưa đúng.</b> Máy nghe thành “${esc(alts[0].transcript)}”.`;
        show(v + `<br><span class="mut">Máy nghe được: “${esc(best.a.transcript)}”${conf ? ' · độ tin cậy ' + conf + '%' : ''}. Bấm 🔊 nghe mẫu rồi thử lại.</span>`)
      };
      rc.onerror = ev => { done = true; show('<span class="mut">' + micMsg(ev.error) + '</span>') };
      rc.onend = () => { if (!done) show('<span class="mut">Không nghe thấy tiếng. Hãy thử lại.</span>') };
      try { rc.start() } catch (e) { }
    }

    let showKeyBox = false;
    V.vocab = () => {
      const L = VL(), idx = IDX(), k = S[KK()] || {}; const n = Object.values(k).filter(Boolean).length;
      const cats = [...new Set(L.map(w => w[3]))]; if (vcat !== 'all' && !cats.includes(vcat)) vcat = 'all';
      const hasKey = !!getApiKey();
      const head = `<h2>${mode === 'chat' ? 'Cụm từ giao tiếp' : 'Từ vựng TOEIC'}</h2><p class="mut">${L.length} mục theo ${cats.length} chủ đề. Đã thuộc ${n}/${L.length}.</p><div class="bar"><i style="width:${n / L.length * 100}%"></i></div>
<div class="row" style="margin:12px 0"><select id="vc" class="btn" aria-label="Chủ đề"><option value="all">Tất cả (${L.length})</option>${cats.map(c => `<option ${c === vcat ? 'selected' : ''} value="${esc(c)}">${esc(c)} (${L.filter(w => w[3] === c).length})</option>`).join('')}</select>${[['card', 'Thẻ lật'], ['list', 'Danh sách'], ['quiz', 'Bài tập']].map(([a, t]) => `<button class="btn ${vview === a ? 'p' : ''}" data-v="${a}">${t}</button>`).join('')}<button class="btn" id="vg">✨ Tạo ví dụ & loại từ</button><button class="btn" id="vkeyBtn">${hasKey ? '🔑 Đã có Key' : '🔑 Nhập API Key'}</button></div>
<div class="card" id="vkeyBox" ${showKeyBox ? '' : 'hidden'} style="margin:8px 0">
  <div class="row">
    <input type="password" id="vkeyInp" class="btn" style="flex:1;min-width:220px" placeholder="Dán Gemini API Key (AIzaSy...) vào đây" value="${esc(getApiKey())}">
    <button class="btn p" id="vkeySave">Lưu Key</button>
    ${hasKey ? '<button class="btn" id="vkeyDel">Xóa Key</button>' : ''}
  </div>
  <p class="mut" style="margin:6px 0 0;font-size:12px">Key chỉ lưu cục bộ trong trình duyệt máy bạn (localStorage), tuyệt đối không bị lộ lên GitHub. Lấy miễn phí tại <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener" style="color:var(--acc)">Google AI Studio</a>.</p>
</div>
<p class="mut" id="vmsg" style="margin:0 0 10px;font-size:13px">${vstat()}</p>`;
      if (vview === 'quiz') return head + quizView();
      if (vview === 'list') return head + `<div class="card" id="vl">${idx.map(i => lineHTML(i, k)).join('')}</div>`;
      const dk = DECK();
      if (!dk.length) return head + `<div class="card"><h3>🎉 Bạn đã thuộc hết các từ trong danh sách này</h3><p class="mut">Chọn chủ đề khác, hoặc tắt chế độ “Chỉ ôn từ chưa thuộc” để xem lại tất cả.</p><button class="btn p" id="vo">Xem lại tất cả</button></div>`;
      const cur = vi % dk.length;
      return head + `<label class="row mut" style="margin:0 0 8px"><input type="checkbox" id="vonly" ${vonly ? 'checked' : ''}> Chỉ ôn các từ chưa thuộc (${dk.length} từ)</label>
<div class="card flash" id="fc" tabindex="0" role="button" aria-label="Lật thẻ"><div>${cardFace(dk[cur], flip, cur + 1, dk.length)}</div></div>
<div class="row" style="justify-content:center;margin-bottom:8px"><button class="btn" id="vs">🔊 Đọc từ</button><button class="btn p" id="vm" ${BAD.test(L[dk[cur]][0]) ? 'disabled' : ''}>🎙 Đọc thử từ</button></div>
<div class="row" style="justify-content:center;margin-bottom:8px"><button class="btn" id="ve" ${info(dk[cur]).ex ? '' : 'disabled'}>🔊 Đọc ví dụ</button><button class="btn p" id="vme" ${info(dk[cur]).ex ? '' : 'disabled'}>🎙 Đọc thử ví dụ</button></div>
<div id="vres" aria-live="polite" style="min-height:24px;margin:6px 0 12px;text-align:center">${vres && vres.i === dk[cur] ? vres.h : ''}</div>
<div class="row" style="justify-content:space-between"><button class="btn" id="vpv">← Từ trước</button><button class="btn" id="vnx">Từ tiếp →</button></div>
<div class="row" style="margin-top:10px"><button class="btn" id="vn">✗ Chưa thuộc</button><button class="btn p" id="vk">✓ Đã thuộc</button></div>
<p class="mut" style="font-size:13px;margin:12px 0 8px"><b>Đã thuộc</b>: tính vào thanh tiến độ ở trên, và khi bật “Chỉ ôn từ chưa thuộc” thì từ đó biến khỏi bộ thẻ. <b>Chưa thuộc</b>: giữ từ lại để ôn tiếp. Cả hai nút đều tự chuyển sang từ kế tiếp. Có thể dùng phím ← → để đổi từ và Enter để lật thẻ.</p>
<button class="btn" id="vr">Xóa tiến độ</button>`};

    I.vocab = () => {
      const L = VL(), idx = IDX(); document.onkeydown = null; $('#vc').onchange = e => { vcat = e.target.value; vi = 0; flip = false; Q = null; go('vocab') };
      document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { vview = b.dataset.v; go('vocab'); if (vview !== 'quiz') prefetch() });
      $('#vg').onclick = genBtn;
      $('#vkeyBtn').onclick = () => { showKeyBox = !showKeyBox; go('vocab') };
      const kbSave = $('#vkeySave'); if (kbSave) kbSave.onclick = () => {
        const val = $('#vkeyInp').value.trim();
        setApiKey(val);
        showKeyBox = false;
        vErr = '';
        go('vocab');
        if (val) prefetch();
      };
      const kbDel = $('#vkeyDel'); if (kbDel) kbDel.onclick = () => {
        setApiKey('');
        showKeyBox = false;
        go('vocab');
      };
      if (vview === 'quiz') return quizBind();
      if (vview === 'list') { $('#vl').onclick = e => { const a = e.target.closest('[data-w]'), b = e.target.closest('[data-e]'), m = e.target.closest('[data-m]'); if (a) say(L[a.dataset.w][0]); else if (b) say(info(+b.dataset.e).ex); else if (m) recCheck(L[m.dataset.m][0], h => { const o = $('#lr' + m.dataset.m); if (o) o.innerHTML = h }) }; return }
      const dk = DECK(); if (!dk.length) { $('#vo').onclick = () => { vonly = false; go('vocab') }; return }
      const real = () => dk[vi % dk.length];
      const step = d => { vi = ((vi % dk.length) + d + dk.length) % dk.length; flip = false; go('vocab'); prefetch(true) };
      const mark = v => { S[KK()] = S[KK()] || {}; S[KK()][real()] = v; save(); if (vonly && v) vi = vi % dk.length; else vi = (vi + 1) % dk.length; flip = false; go('vocab'); prefetch(true) };
      $('#vonly').onchange = e => { vonly = e.target.checked; vi = 0; flip = false; go('vocab') };
      $('#fc').onclick = () => { flip = !flip; go('vocab'); if (flip) prefetch() }; $('#fc').onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip = !flip; go('vocab') } };
      document.onkeydown = e => { if (curTab === 'vocab' && vview === 'card' && !/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) { if (e.key === 'ArrowRight') step(1); else if (e.key === 'ArrowLeft') step(-1) } };
      $('#vpv').onclick = () => step(-1); $('#vnx').onclick = () => step(1);
      $('#vs').onclick = () => say(L[real()][0]); $('#ve').onclick = () => { const x = info(real()).ex; if (x) say(x) };
      const rshow = i => h => { vres = { i, h }; const o = $('#vres'); if (o && real() === i) o.innerHTML = h };
      $('#vm').onclick = () => recCheck(L[real()][0], rshow(real())); $('#vme').onclick = () => { const x = info(real()).ex; if (x) recCheck(x, rshow(real())) }; $('#vn').onclick = () => mark(false); $('#vk').onclick = () => mark(true);
      $('#vr').onclick = () => { if (confirm('Xóa toàn bộ tiến độ “đã thuộc” của chương trình này?')) { S[KK()] = {}; save(); vi = 0; flip = false; go('vocab') } }
    };

    drawModes(); go(MODES[mode].tabs[0][0]);
    if (window.claude && claude.use) dbInit();
  </script>
</body>

</html>
